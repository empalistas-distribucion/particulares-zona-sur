<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedido - EmpaListas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mostaza: #FED287;
    --mostaza-suave: #FFF3DC;
    --terracota: #C45433;
    --terracota-oscuro: #9C3C22;
    --marron: #3B2A20;
    --marron-suave: #6C5644;
    --blanco: #FFFCF7;
    --borde: #F0DAB8;
    --ok: #4C7A4C;
    --rosa: #C97A82;
    --rosa-suave: #FBEFEF;
    --rosa-oscuro: #9C4F57;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--mostaza-suave);
    color: var(--marron);
    padding-bottom: 140px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }

  header {
    background: var(--mostaza);
    padding: 28px 18px 34px;
    text-align: center;
    border-bottom: 4px solid var(--terracota);
    margin-bottom: 4px;
  }
  .logos-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .logos-header img.logo-empa { width: 108px; height: 108px; border-radius: 50%; object-fit: cover; border: 3px solid var(--terracota); }
  .logos-header .mas { font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; color: var(--terracota-oscuro); align-self: center; }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--terracota-oscuro);
  }
  header p.sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14.5px;
    color: var(--marron-suave);
    margin-top: 2px;
  }

  .aviso {
    background: var(--terracota);
    color: var(--blanco);
    text-align: center;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 16px;
    line-height: 1.5;
  }
  .aviso b { font-weight: 700; }

  section { margin-top: 22px; }
  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--terracota);
    margin-bottom: 8px;
  }
  .eyebrow .nota { text-transform: none; font-weight: 500; letter-spacing: 0; color: var(--marron-suave); }
  .eyebrow.rosa { color: var(--rosa-oscuro); }

  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--marron-suave); }
  .campo input, .campo select {
    width: 100%;
    font-family: inherit;
    font-size: 15.5px;
    padding: 12px 13px;
    border: 1.5px solid var(--borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--marron);
  }
  .campo input:focus, .campo select:focus { outline: 2px solid var(--terracota); border-color: var(--terracota); }

  .producto {
    background: var(--blanco);
    border: 1.5px solid var(--borde);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .producto.postre { border-color: #EAD3D3; }
  .producto .info { flex: 1; min-width: 0; }
  .producto .nombre { font-weight: 700; font-size: 16px; }
  .producto .precio { font-size: 13.5px; color: var(--marron-suave); margin-top: 2px; }
  .producto .minimo { font-size: 11.5px; color: var(--terracota-oscuro); margin-top: 3px; font-weight: 600; }
  .producto .minimo.oculto { visibility: hidden; }

  .stepper { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  .stepper button {
    width: 38px; height: 38px;
    border: none;
    background: var(--terracota);
    color: var(--blanco);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper.rosa button { background: var(--rosa-oscuro); }
  .stepper button:first-child { border-radius: 10px 0 0 10px; }
  .stepper button:last-child { border-radius: 0 10px 10px 0; }
  .stepper button:active { filter: brightness(0.85); }
  .stepper .cant {
    width: 42px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: var(--mostaza-suave);
    font-weight: 700; font-size: 15.5px;
    border-top: 1.5px solid var(--borde);
    border-bottom: 1.5px solid var(--borde);
  }
  .stepper.rosa .cant { background: var(--rosa-suave); }

  .toggle-otras {
    width: 100%;
    background: var(--terracota);
    border: none;
    border-radius: 14px;
    padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Work Sans', sans-serif;
    cursor: pointer;
    margin-bottom: 4px;
    box-shadow: 0 3px 10px rgba(156,60,34,0.25);
  }
  .toggle-otras .texto { text-align: left; }
  .toggle-otras .titulo-toggle {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--blanco);
  }
  .toggle-otras .sub-toggle {
    font-size: 12.5px;
    color: #FFE3D6;
    margin-top: 2px;
  }
  .toggle-otras .flecha {
    transition: transform 0.2s;
    font-size: 20px;
    color: var(--blanco);
    flex-shrink: 0;
    margin-left: 12px;
  }
  .toggle-otras.abierto .flecha { transform: rotate(180deg); }
  #panelOtras { display: none; margin-top: 12px; }
  #panelOtras.abierto { display: block; }
  .otras-nota { font-size: 12.5px; color: var(--marron-suave); margin-bottom: 12px; line-height: 1.5; background: var(--mostaza-suave); border-radius: 10px; padding: 10px 12px; }
  .otras-nota b { color: var(--terracota-oscuro); }

  .banner-postre {
    background: linear-gradient(135deg, var(--rosa-suave), #FFF8F5);
    border: 1.5px solid #EAD3D3;
    border-radius: 14px;
    padding: 16px 18px;
    text-align: center;
    margin-bottom: 14px;
  }
  .banner-postre .titulo {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 19px;
    color: var(--rosa-oscuro);
  }
  .banner-postre .sub { font-size: 12.5px; color: var(--marron-suave); margin-top: 4px; }

  .resumen {
    background: var(--blanco);
    border: 1.5px solid var(--borde);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .resumen .linea {
    display: flex; justify-content: space-between;
    font-size: 14.5px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--borde);
    gap: 10px;
  }
  .resumen .linea span:first-child { flex: 1; }
  .resumen .linea:last-of-type { border-bottom: none; }
  .resumen .subtitulo { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--terracota); margin: 12px 0 4px; }
  .resumen .subtitulo.rosa { color: var(--rosa-oscuro); }
  .resumen .subtitulo:first-child { margin-top: 0; }
  .resumen .aconvenir { color: var(--marron-suave); font-style: italic; }
  .resumen .total {
    display: flex; justify-content: space-between;
    font-weight: 700; font-size: 18px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px solid var(--terracota);
    color: var(--terracota-oscuro);
  }
  .resumen .total-nota { font-size: 11.5px; font-weight: 500; color: var(--marron-suave); text-align: right; margin-top: 2px; }
  .resumen .vacio { font-size: 14px; color: var(--marron-suave); font-style: italic; text-align: center; padding: 8px 0; }

  .barra-fija {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--blanco);
    border-top: 2px solid var(--terracota);
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .barra-fija .totalito { font-size: 13px; color: var(--marron-suave); text-align: center; margin-bottom: 8px; }
  .barra-fija .totalito b { color: var(--terracota-oscuro); font-size: 16px; }
  #btnConfirmar {
    width: 100%;
    background: var(--terracota);
    color: var(--blanco);
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  #btnConfirmar:disabled { background: #D8B896; cursor: not-allowed; }
  #btnConfirmar:not(:disabled):active { background: var(--terracota-oscuro); }
  .error-msg { color: var(--terracota-oscuro); font-size: 12.5px; text-align: center; margin-top: 6px; min-height: 16px; }

  #pantallaOk {
    display: none;
    position: fixed; inset: 0;
    background: var(--mostaza-suave);
    z-index: 50;
    overflow-y: auto;
    padding: 40px 20px;
    text-align: center;
  }
  #pantallaOk .check {
    width: 70px; height: 70px;
    background: var(--ok);
    border-radius: 50%;
    color: white;
    font-size: 36px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  #pantallaOk h2 { font-family: 'Fraunces', serif; font-size: 24px; color: var(--terracota-oscuro); margin-bottom: 8px; }
  #pantallaOk p { font-size: 14.5px; color: var(--marron-suave); margin-bottom: 24px; }
  #resumenOk {
    background: var(--blanco);
    border: 1.5px solid var(--borde);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: left;
    margin-bottom: 22px;
  }
  .btn-whatsapp {
    display: block;
    width: 100%;
    background: #25D366;
    color: white;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 12px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-whatsapp.rosa { background: var(--rosa-oscuro); }
  .btn-whatsapp.oculto { display: none; }
  .btn-volver {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--terracota-oscuro);
    font-weight: 600;
    font-size: 14.5px;
    padding: 10px;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>

  <h1>EmpaListas</h1>
  <p class="sub">Ped&iacute; tu docena de empanadas</p>
</header>

<div class="wrap">

  <section>
    <div class="eyebrow">Tus datos</div>
    <div class="campo">
      <label for="comercio">Nombre del comercio (si sos particular, dejalo en blanco)</label>
      <input type="text" id="comercio" placeholder="Ej: Almac&eacute;n Rivadavia">
    </div>
    <div class="campo">
      <label for="zona">Zona / Barrio</label>
      <input type="text" id="zona" placeholder="Ej: Zona Noreste, C&oacute;rdoba">
    </div>
    <div class="campo">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" placeholder="Nombre y apellido">
    </div>
    <div class="campo">
      <label for="celular">Tu celular (WhatsApp)</label>
      <input type="tel" id="celular" placeholder="Ej: 351 555-1234">
    </div>
  </section>

  <section>
    <div class="eyebrow">Empanadas cl&aacute;sicas <span class="nota">&middot; desde 1 docena &middot; siempre hay stock</span></div>
    <div id="listaPrincipales"></div>
  </section>

  <section>
    <div class="eyebrow">Tu pedido</div>
    <div class="resumen" id="resumen">
      <div class="vacio">Todav&iacute;a no agregaste nada</div>
    </div>
  </section>

</div>

<div class="barra-fija">
  <div class="totalito">Total: <b id="totalChico">$0</b></div>
  <button id="btnConfirmar" disabled>Confirmar pedido</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div id="pantallaOk">
  <div class="wrap">
    <div class="check">&#10003;</div>
    <h2>&iexcl;Pedido confirmado!</h2>
    <p>Revis&aacute; el resumen y envialo por WhatsApp para que quede registrado.</p>
    <div id="resumenOk"></div>
    <a href="#" id="linkWhatsapp" class="btn-whatsapp" target="_blank">Enviar pedido por WhatsApp</a>
    <button class="btn-volver" id="btnVolver">&larr; Volver y modificar el pedido</button>
  </div>
</div>

<script>
  // ==========================================================
  // ✏️ EDITÁ ACÁ LOS DATOS: número, mínimos, variedades y precios
  // ==========================================================
  const NUMERO_WHATSAPP_EMPANADAS = "5493516596060"; // EmpaListas
  const MINIMO_PRINCIPALES = 1;
  const MINIMO_OTRAS = 3;
  const PRECIO_PRINCIPALES = 13350; // por docena

  const PRINCIPALES = [
    { id: "criolla_salada", nombre: "Criollas Saladas" },
    { id: "arabes",         nombre: "\u00c1rabes" },
    { id: "jamon_queso",    nombre: "Jam\u00f3n y Queso" },
    { id: "criolla_dulce",  nombre: "Criolla Dulce" },
    { id: "pollo",          nombre: "Pollo" },
  ];

  const OTRAS = [];  // sin otras variedades en este link (solo las 5 clasicas)

  // ==========================================================

  const cantidades = {};
  PRINCIPALES.forEach(p => cantidades[p.id] = 0);
  OTRAS.forEach(p => cantidades[p.id] = 0);

  const fmt = n => "$" + n.toLocaleString("es-AR");

  function renderProducto(p, minimo, precioTexto, claseExtra) {
    const cant = cantidades[p.id];
    const bajoMinimo = minimo > 0 && cant > 0 && cant < minimo;
    const div = document.createElement("div");
    div.className = "producto" + (claseExtra ? " " + claseExtra : "");
    div.innerHTML = `
      <div class="info">
        <div class="nombre">${p.nombre}</div>
        <div class="precio">${precioTexto}</div>
        <div class="minimo ${bajoMinimo ? '' : 'oculto'}">M&iacute;nimo ${minimo} docenas</div>
      </div>
      <div class="stepper ${claseExtra === 'postre' ? 'rosa' : ''}">
        <button onclick="cambiar('${p.id}', -1)" aria-label="Restar">&minus;</button>
        <div class="cant">${cant}</div>
        <button onclick="cambiar('${p.id}', 1)" aria-label="Sumar">&plus;</button>
      </div>
    `;
    return div;
  }

  function render() {
    const contP = document.getElementById("listaPrincipales");
    contP.innerHTML = "";
    PRINCIPALES.forEach(p => contP.appendChild(renderProducto(p, MINIMO_PRINCIPALES, `${fmt(PRECIO_PRINCIPALES)} c/u (docena)`)));

    renderResumen();
  }

  function cambiar(id, delta) {
    cantidades[id] = Math.max(0, cantidades[id] + delta);
    render();
  }

  function renderResumen() {
    const resumen = document.getElementById("resumen");
    const itemsP = PRINCIPALES.filter(p => cantidades[p.id] > 0);
    const itemsO = OTRAS.filter(p => cantidades[p.id] > 0);
    let total = 0;

    if (itemsP.length === 0 && itemsO.length === 0) {
      resumen.innerHTML = `<div class="vacio">Todav&iacute;a no agregaste nada</div>`;
    } else {
      let html = "";
      if (itemsP.length > 0) {
        html += `<div class="subtitulo">Empanadas cl\u00e1sicas</div>`;
        itemsP.forEach(p => {
          const sub = PRECIO_PRINCIPALES * cantidades[p.id];
          total += sub;
          html += `<div class="linea"><span>${p.nombre} &times; ${cantidades[p.id]} doc.</span><span>${fmt(sub)}</span></div>`;
        });
      }
      if (itemsO.length > 0) {
        html += `<div class="subtitulo">Otras variedades (a convenir)</div>`;
        itemsO.forEach(p => {
          html += `<div class="linea"><span>${p.nombre} &times; ${cantidades[p.id]} doc.</span><span class="aconvenir">a convenir</span></div>`;
        });
      }
      html += `<div class="total"><span>Total</span><span>${fmt(total)}</span></div>`;
      if (itemsO.length > 0) {
        html += `<div class="total-nota">+ precio a convenir por las otras variedades</div>`;
      }
      resumen.innerHTML = html;
    }
    document.getElementById("totalChico").textContent = fmt(total);

    const bajoMinP = itemsP.some(p => cantidades[p.id] < MINIMO_PRINCIPALES);
    const bajoMinO = itemsO.some(p => cantidades[p.id] < MINIMO_OTRAS);
    const btn = document.getElementById("btnConfirmar");
    const err = document.getElementById("errorMsg");
    const hayAlgo = itemsP.length > 0 || itemsO.length > 0;
    if (!hayAlgo) {
      btn.disabled = true; err.textContent = "";
    } else if (bajoMinP || bajoMinO) {
      btn.disabled = true;
      err.textContent = `Hay variedades de empanadas por debajo del m\u00ednimo de ${MINIMO_PRINCIPALES} docenas`;
    } else {
      btn.disabled = false; err.textContent = "";
    }
  }

  document.getElementById("btnConfirmar").addEventListener("click", () => {
    const comercio = document.getElementById("comercio").value.trim();
    const zona = document.getElementById("zona").value.trim();
    const nombre = document.getElementById("nombre").value.trim();
    const celular = document.getElementById("celular").value.trim();

    if (!nombre || !celular) {
      document.getElementById("errorMsg").textContent = "Complet\u00e1 tu nombre y tu celular";
      return;
    }

    const itemsP = PRINCIPALES.filter(p => cantidades[p.id] > 0);
    const itemsO = OTRAS.filter(p => cantidades[p.id] > 0);
    let total = 0;
    let listaHtml = "";
    let listaTexto = "";

    if (itemsP.length > 0) {
      listaTexto += "EMPANADAS CL\u00c1SICAS:\n";
      listaHtml += `<div class="subtitulo">Empanadas cl\u00e1sicas</div>`;
      itemsP.forEach(p => {
        const sub = PRECIO_PRINCIPALES * cantidades[p.id];
        total += sub;
        listaTexto += `\u2022 ${p.nombre} x ${cantidades[p.id]} doc. = ${fmt(sub)}\n`;
        listaHtml += `<div class="linea"><span>${p.nombre} &times; ${cantidades[p.id]} doc.</span><span>${fmt(sub)}</span></div>`;
      });
    }
    if (itemsO.length > 0) {
      listaTexto += "\nOTRAS VARIEDADES (a convenir, 5 d\u00edas h\u00e1biles):\n";
      listaHtml += `<div class="subtitulo">Otras variedades (a convenir)</div>`;
      itemsO.forEach(p => {
        listaTexto += `\u2022 ${p.nombre} x ${cantidades[p.id]} doc.\n`;
        listaHtml += `<div class="linea"><span>${p.nombre} &times; ${cantidades[p.id]} doc.</span><span class="aconvenir">a convenir</span></div>`;
      });
    }
    const resumenOkHtml = `
      <div class="linea"><span><b>Comercio</b></span><span>${comercio || "-"}</span></div>
      <div class="linea"><span><b>Zona</b></span><span>${zona || "-"}</span></div>
      <div class="linea"><span><b>Contacto</b></span><span>${nombre}</span></div>
      ${listaHtml}
      <div class="total"><span>Total</span><span>${fmt(total)}</span></div>
    `;
    document.getElementById("resumenOk").innerHTML = resumenOkHtml;

    const mensaje =
`Pedido EmpaListas

Comercio: ${comercio || "-"}
Zona: ${zona || "-"}
Contacto: ${nombre}
Celular: ${celular}

${listaTexto}
Total: ${fmt(total)}${itemsO.length > 0 ? "\n(+ precio a convenir por las otras variedades)" : ""}`;

    const link = document.getElementById("linkWhatsapp");
    link.href = `https://wa.me/${NUMERO_WHATSAPP_EMPANADAS}?text=${encodeURIComponent(mensaje)}`;

    document.getElementById("pantallaOk").style.display = "block";
    window.scrollTo(0, 0);
  });

  document.getElementById("btnVolver").addEventListener("click", () => {
    document.getElementById("pantallaOk").style.display = "none";
  });

  render();
</script>

</body>
</html>
